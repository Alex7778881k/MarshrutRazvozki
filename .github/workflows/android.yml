
name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9

      - name: Check AndroidManifest.xml
        run: |
          echo "Проверка AndroidManifest.xml"
          cat -A app/src/main/AndroidManifest.xml
          echo "Проверка XML"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML OK')"

      - name: Build APK
        env:
          DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
        run: |
          if [ -z "$DGIS_API_KEY" ]; then
            echo "Ошибка: DGIS_API_KEY не найден в GitHub Secrets"
            exit 1
          fi

          gradle assembleDebug \
            -PdgisApiKey="$DGIS_API_KEY" \
            --stacktrace \
            --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarshrutRazvozki-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
